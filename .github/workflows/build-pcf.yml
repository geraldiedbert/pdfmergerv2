name: Build PCF Solution

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Power Platform CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool

      - name: Install root dependencies
        run: npm install

      - name: Install PCF dependencies
        run: npm --prefix pcf install

      - name: Build PCF bundle
        run: npm --prefix pcf run build

      - name: Init solution project
        run: pac solution init --publisher-name PDFSolutionV4Publisher --publisher-prefix pdfv4 --outputDirectory PDFSolutionV4Solution

      - name: Set solution version
        shell: pwsh
        run: |
          $path = "PDFSolutionV4Solution/src/Other/Solution.xml"
          (Get-Content $path) -replace '<Version>.*</Version>', '<Version>1.0.0.0</Version>' | Set-Content $path

      - name: Add PCF reference
        working-directory: PDFSolutionV4Solution
        run: pac solution add-reference --path ../pcf

      - name: Build solution package
        working-directory: PDFSolutionV4Solution
        run: dotnet build --configuration Release /p:SolutionPackageType=Unmanaged

      - name: Copy solution zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "PDFSolutionV4Solution/bin/Release" -Filter *.zip | Select-Object -First 1
          Copy-Item $zip.FullName "PDFSolutionV4Solution_IMPORT_THIS.zip"

      - name: Validate solution zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("PDFSolutionV4Solution_IMPORT_THIS.zip")
          $names = $zip.Entries | ForEach-Object { $_.Name }
          $zip.Dispose()
          if (-not ($names -contains "solution.xml") -or -not ($names -contains "customizations.xml")) {
            throw "Solution zip is missing solution.xml or customizations.xml at its root."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFSolutionV4Solution_IMPORT_THIS.zip
          path: PDFSolutionV4Solution_IMPORT_THIS.zip
          compression-level: 0
